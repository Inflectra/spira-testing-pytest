[pytest]
# Pytest configuration for pytest-spiratest

# Disable Spira integration when running the test suite
addopts = -p no:pytest-spiratest

# Test paths
testpaths = tests

# Minimum version
minversion = 6.0

# Note: You may see a NotOpenSSLWarning from urllib3 on macOS with LibreSSL.
# This is a system-level issue and does not affect test functionality.
