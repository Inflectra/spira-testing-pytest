[credentials]
# Following are required
url = http://localhost/spira
username = administrator
token = {B9050F75-C5E6-4244-8712-FBF20061A976}
project_id = 1
# Following are optional:
release_id = 5
test_set_id = 1

[test_cases]
# Default test case ID for unmapped tests
default = 22

# Function-level mappings (exact function name)
test_add_2 = 23
test_add_function = 26

# Class-level mappings (class name - all tests in class use this ID unless overridden)
testgroup = 24
testmathoperations = 27
testadvanced = 28

# Legacy format still supported (ClassName.method_name)
TestGroup.test_add_4 = 24
TestGroup.test_add_5 = 25

[markers]
# Map existing pytest markers to Spira test cases
# All tests with these markers will map to the specified test case
smoke = 100
regression = 101
integration = 102
critical = 103
slow = 104

[settings]
# Optional: Enable verbose logging (shows test case mappings and API calls)
# Values: true/false, yes/no, 1/0, on/off
verbose = false

# Optional: Enable/disable Spira integration
# Can be overridden by CLI flags: --spira-enabled or --spira-disabled
enabled = true

# Optional: Enable batch mode (post all results at once at end of test run)
# Improves performance for large test suites (100+ tests)
# Can be overridden by CLI flags: --spira-batch or --spira-no-batch
batch_mode = false

# Optional: Batch size limit (maximum test runs per API call in batch mode)
# Default: 500 (Spira API limit)
# If you have more tests than this, they will be split into multiple batches
# Reduce this if you experience timeouts with large batches
batch_size = 500
